name: Release
on:
  push:
    tags:
      - v*

env:
  FORCE_COLOR: true

permissions:
  contents: write
  actions: read # SignPath fetches the unsigned artifact
  id-token: write # needed for attestations
  attestations: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
      - name: Install Go dependencies
        run: go get -v
      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply patches/wayland.patch
      - name: Build GUI (X11)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags static -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Equilotl-x11
      - name: Build GUI (Wayland)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static wayland" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Equilotl-wayland
      - name: Build GUI (Combined)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static combined" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Equilotl
      - name: Build CLI
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "cli" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o EquilotlCli-linux
      - run: chmod +x Equilotl*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Equilotl-linux
          path: |
            Equilotl-x11
            Equilotl-wayland
            Equilotl
            EquilotlCli-linux

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-arm64-go-${{ hashFiles('**/go.sum') }}
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
      - name: Install Go dependencies
        run: go get -v
      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply patches/wayland.patch
      - name: Build GUI (X11)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags static -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Equilotl-x11-arm64
      - name: Build GUI (Wayland)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "static wayland" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Equilotl-wayland-arm64
      - name: Build GUI (Combined)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "static combined" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Equilotl-arm64
      - name: Build CLI
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -v -tags "cli" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o EquilotlCli-linux-arm64
      - run: chmod +x Equilotl*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Equilotl-linux-arm64
          path: |
            Equilotl-x11-arm64
            Equilotl-wayland-arm64
            Equilotl-arm64
            EquilotlCli-linux-arm64

  build-mac:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            artifact_name: Equilotl-macos
            dmg_name: Equilotl-x64.dmg
          - arch: arm64
            runner: macos-latest
            artifact_name: Equilotl-macos-arm64
            dmg_name: Equilotl-arm64.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
      - run: brew install sdl2 create-dmg
      - run: go get -v
      - name: Build DMG (unsigned)
        run: |
          make ARCH=${{ matrix.arch }} GUI=1 DMG=1 VERSION=${{ github.ref_name }}
          mv build/Equilotl.dmg ${{ matrix.dmg_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dmg_name }}

  build-mac-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
      - run: brew install sdl2 create-dmg
      - run: go get -v
      - name: Build universal DMG (unsigned)
        run: |
          make ARCH=universal GUI=1 DMG=1 VERSION=${{ github.ref_name }}
          mv build/Equilotl.dmg Equilotl.dmg
      - name: Build CLI
        run: |
          make ARCH=amd64 GUI=0 VERSION=${{ github.ref_name }}
          mv build/EquilotlCli-darwin EquilotlCli-x64
          make ARCH=arm64 GUI=0 VERSION=${{ github.ref_name }}
          mv build/EquilotlCli-darwin EquilotlCli-arm64
          make ARCH=universal GUI=0 VERSION=${{ github.ref_name }}
          mv build/EquilotlCli-darwin EquilotlCli-universal
      - name: Ad-hoc sign CLI (free, avoids "killed" error on Apple Silicon)
        run: |
          for f in EquilotlCli-*; do codesign --force --sign - "$f"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Equilotl-macos-universal
          path: |
            Equilotl.dmg
            EquilotlCli-x64
            EquilotlCli-arm64
            EquilotlCli-universal

  build-windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_KEY: ${{ secrets.SIGNPATH_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          path-type: inherit
      - name: Install Windows dependencies
        shell: msys2 {0}
        run: pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2
      - name: Install Go dependencies
        shell: msys2 {0}
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e # v0.3.3
      - name: Build GUI
        shell: msys2 {0}
        run: |
          go-winres make --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Equilotl.exe
      - name: Build CLI
        shell: msys2 {0}
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "cli" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o EquilotlCli.exe
          cp EquilotlCli.exe EquilotlCli-x64.exe
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Equilotl-windows-unsigned
          path: |
            Equilotl.exe
            EquilotlCli.exe
            EquilotlCli-x64.exe
      - name: Sign with SignPath (only if secrets are configured)
        if: ${{ env.SIGNPATH_API_KEY != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_KEY }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: Equilotl
          signing-policy-slug: release-signing
          artifact-configuration-slug: x64
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: windows-signed/
      - name: Use signed files if available
        shell: bash
        run: |
          if [ -d windows-signed ]; then cp -f windows-signed/*.exe . ; echo "Using signed binaries"; else echo "Using unsigned binaries"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Equilotl-windows
          path: |
            Equilotl.exe
            EquilotlCli.exe
            EquilotlCli-x64.exe

  build-windows-arm64:
    runs-on: windows-latest
    env:
      SIGNPATH_API_KEY: ${{ secrets.SIGNPATH_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"
      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $version = "20260908"
          $sha256 = "1bcf74d06b724aeecaa6412ca85f5b26fb1da770e7cdcefa9263c9c5c3ad34b6"
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sha256) { throw "llvm-mingw checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\llvm-mingw-$version-ucrt-x86_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install Go dependencies
        shell: bash
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e # v0.3.3
      - name: Build GUI
        shell: bash
        run: |
          "$(go env GOPATH)/bin/go-winres" make --arch arm64 --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=arm64 CC=aarch64-w64-mingw32-clang CXX=aarch64-w64-mingw32-clang++ go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Equilotl-arm64.exe
      - name: Build CLI
        shell: bash
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -v -tags "cli" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o EquilotlCli-arm64.exe
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Equilotl-windows-arm64-unsigned
          path: |
            Equilotl-arm64.exe
            EquilotlCli-arm64.exe
      - name: Sign with SignPath (only if secrets are configured)
        if: ${{ env.SIGNPATH_API_KEY != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_KEY }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: Equilotl
          signing-policy-slug: release-signing
          artifact-configuration-slug: arm64
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: windows-signed/
      - name: Use signed files if available
        shell: bash
        run: |
          if [ -d windows-signed ]; then cp -f windows-signed/*.exe . ; echo "Using signed binaries"; else echo "Using unsigned binaries"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Equilotl-windows-arm64
          path: |
            Equilotl-arm64.exe
            EquilotlCli-arm64.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-arm64, build-mac, build-mac-dmg, build-windows, build-windows-arm64]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Equilotl-linux
          path: linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Equilotl-linux-arm64
          path: linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Equilotl-macos
          path: macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Equilotl-macos-arm64
          path: macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Equilotl-macos-universal
          path: macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Equilotl-windows
          path: windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Equilotl-windows-arm64
          path: windows
      - name: Generate SHA256 checksums
        run: |
          mkdir dist
          cp linux/* dist/ ; cp macos/* dist/ ; cp windows/*.exe dist/
          cd dist && sha256sum * > SHA256SUMS.txt
          mv SHA256SUMS.txt ../SHA256SUMS.txt
      - name: Attest build provenance (free, GitHub-signed)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          make_latest: ${{ !contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            This is release ${{ github.ref_name }} of Equilotl.
            Verify downloads with `SHA256SUMS.txt` or:
            `gh attestation verify <file> --repo ${{ github.repository }}`
          files: |
            linux/Equilotl-x11
            linux/Equilotl-wayland
            linux/Equilotl
            linux/EquilotlCli-linux
            linux/Equilotl-x11-arm64
            linux/Equilotl-wayland-arm64
            linux/Equilotl-arm64
            linux/EquilotlCli-linux-arm64
            macos/Equilotl-x64.dmg
            macos/Equilotl-arm64.dmg
            macos/Equilotl.dmg
            macos/EquilotlCli-x64
            macos/EquilotlCli-arm64
            macos/EquilotlCli-universal
            windows/Equilotl*.exe
            SHA256SUMS.txt
